name: P0 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential clang cmake libasound2-dev libfontconfig1-dev libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libvulkan-dev libssl-dev libzstd-dev
      - run: python scripts/bundle_resources.py fetch --target ${{ matrix.target }}
      - run: python scripts/bundle_resources.py verify --target ${{ matrix.target }}
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo fmt --check
      - run: cargo test --locked --no-default-features
      - run: cargo check --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - run: python scripts/package_app.py --target ${{ matrix.target }} --output dist/codestyles-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: codestyles-${{ matrix.target }}
          path: dist/*.zip
