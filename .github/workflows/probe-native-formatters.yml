name: Probe unpublished Go and Dart native closures
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Native platforms to probe (never publishes)
        type: choice
        default: all
        options: [all, windows-only]
permissions:
  contents: read
concurrency:
  group: native-formatter-closure-probe
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: matrix
        env:
          PROBE_SCOPE: ${{ inputs.scope }}
        run: echo "matrix=$(python3 scripts/probe_native_formatters.py --matrix "$PROBE_SCOPE")" >> "$GITHUB_OUTPUT"
  probe:
    needs: plan
    name: Probe ${{ matrix.tool }} (${{ matrix.platform.target }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Offline probe contract tests
        run: python -m unittest discover -s scripts -p test_probe_native_formatters.py
      - name: Verify fixed official source and probe native minimal closure
        run: >-
          python scripts/probe_native_formatters.py
          --tool ${{ matrix.tool }} --target ${{ matrix.platform.target }}
          --work-dir "${{ runner.temp }}/formatter-probe"
          --report-dir "${{ github.workspace }}/formatter-probe-reports"
      - name: Production files must remain unchanged
        if: always()
        run: git diff HEAD --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formatter-probe-${{ matrix.tool }}-${{ matrix.platform.target }}
          path: formatter-probe-reports/*
          if-no-files-found: warn
          retention-days: 7
# Reports only: no SDK/binary bundle upload, catalog enabling, or publication.
