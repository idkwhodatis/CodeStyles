[package]
name = "codestyles"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native, offline-first dprint style preview"

[features]
default = ["desktop"]
desktop = ["dep:gpui-kit"]

[dependencies]
gpui-kit = { version = "=0.7.3", optional = true, features = ["tree-sitter-typescript", "tree-sitter-javascript", "tree-sitter-tsx", "tree-sitter-markdown", "tree-sitter-toml", "tree-sitter-python", "tree-sitter-rust"] }
serde_json = "1"
html5ever = "=0.27.0"
toml = "=0.8.23"
tempfile = "3"
jsonc-parser = { version = "0.29", features = ["serde", "cst"] }
sha2 = "0.10"
same-file = "=1.0.6"
fs2 = "0.4.3"
flate2 = "1"
ignore = "0.4"
tokio = { version = "1", features = ["rt", "time", "macros"] }
tar = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "codestyles"
path = "src/main.rs"
required-features = ["desktop"]
