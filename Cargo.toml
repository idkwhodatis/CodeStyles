[package]
name = "codestyles"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native, offline-first dprint style preview"

[features]
default = ["desktop"]
desktop = ["dep:gpui-kit"]

[dependencies]
gpui-kit = { version = "=0.7.3", optional = true, features = ["tree-sitter-typescript", "tree-sitter-javascript", "tree-sitter-tsx", "tree-sitter-markdown", "tree-sitter-toml"] }
serde_json = "1"
tempfile = "3"
jsonc-parser = { version = "0.29", features = ["serde", "cst"] }
sha2 = "0.10"
same-file = "=1.0.6"

[[bin]]
name = "codestyles"
path = "src/main.rs"
required-features = ["desktop"]
